name: Deploy Dev API

on:
  push:
    branches:
      - master
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-dev-api.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/rishi-khiroya/music-api
  IMAGE_TAG: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set metadata
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build and push dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            APP_VERSION=dev
            GIT_SHA=${{ steps.meta.outputs.sha_short }}
            APP_ENV=development
            BUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy on archserver
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.ARCHSERVER_HOST }}
          username: ${{ vars.ARCHSERVER_USER }}
          key: ${{ secrets.ARCHSERVER_SSH_KEY }}
          script: |
            cd /srv/docker/compose/music-dev
            docker compose pull
            docker compose up -d
            docker image prune -f
