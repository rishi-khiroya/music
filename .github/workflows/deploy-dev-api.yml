name: Deploy Dev API

on:
  push:
    branches:
      - master
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-dev-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  API_IMAGE_NAME: ghcr.io/rishi-khiroya/music-api
  MIGRATE_IMAGE_NAME: ghcr.io/rishi-khiroya/music-api-migrate
  IMAGE_TAG: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set metadata
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build and push dev API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            APP_VERSION=dev
            GIT_SHA=${{ steps.meta.outputs.sha_short }}
            APP_ENV=development
            BUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Build and push dev migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile.migrate
          push: true
          tags: ${{ env.MIGRATE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Checkout infra repo
        uses: actions/checkout@v5
        with:
          repository: rishi-khiroya/music-infra
          path: music-infra
          ssh-key: ${{ secrets.MUSIC_INFRA_DEPLOY_KEY }}
          persist-credentials: false

      - name: Prepare deploy key
        run: |
          echo "${{ secrets.ARCHSERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Ensure compose directory exists
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            ${{ vars.ARCHSERVER_USER }}@${{ vars.ARCHSERVER_HOST }} \
            'mkdir -p /srv/docker/compose/music-dev'

      - name: Copy dev compose to archserver
        run: |
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            music-infra/compose/dev/compose.yaml \
            ${{ vars.ARCHSERVER_USER }}@${{ vars.ARCHSERVER_HOST }}:/srv/docker/compose/music-dev/compose.yaml

      - name: Deploy on archserver
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            ${{ vars.ARCHSERVER_USER }}@${{ vars.ARCHSERVER_HOST }} \
            'bash -s' <<'EOF'
            
            set -euo pipefail
            cd /srv/docker/compose/music-dev
            docker compose pull api migrate postgres minio
            docker compose up -d postgres minio
            docker compose run --rm --pull always migrate
            docker compose up -d api
            docker image prune -f

            EOF
